# Copiar como entorno.local.properties y completar (ese archivo no se sube a git).
# Base PostgreSQL: INICIAR_MUESTRA.cmd la crea vacía si no existe, y el backend en perfil demo carga las tablas y los datos al arrancar.
db.url=jdbc:postgresql://localhost:5432/gestapro_prueba_demo
db.usuario=postgres
db.password=<la contraseña que elegiste al instalar PostgreSQL>
crypto.secret=<pedírselo a Lucas: el mismo de la demo>
pg.bin=C:\Program Files\PostgreSQL\17\bin
# Solo para un PostgreSQL portátil que hay que arrancar a mano; si Postgres corre como servicio, dejar pg.data vacío.
pg.data=
pg.puerto=5432
