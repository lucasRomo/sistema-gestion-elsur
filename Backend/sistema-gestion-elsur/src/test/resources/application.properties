
spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
logging.level.org.springframework.security=INFO

app.clave-acceso=clave-de-test
supabase.url=http://localhost:54321
supabase.service-role-key=clave-de-test

app.jwt.secret=test-jwt-secret-no-usar-en-produccion
app.jwt.expiration-ms=36000000
app.jwt.porton-expiration-ms=1800000
app.crypto.secret=test-crypto-secret-no-usar-en-produccion
app.cors.allowed-origins=http://localhost:5173
app.cors.allowed-origin-patterns=http://localhost:*
google.gemini.api.key=
google.gemini.api.url=http://localhost/gemini-test-no-usado
