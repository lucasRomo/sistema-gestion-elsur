# ============================================================================
# Configuración de test. Spring Boot pone esto ADELANTE de src/main/resources/
# application.properties en el classpath de cualquier test (Maven compila a
# target/test-classes antes que target/classes), así que estos valores pisan a
# los de producción automáticamente en TODO @SpringBootTest -- no hace falta
# tocar SistemaGestionApplicationTests.java ni MatrizSeguridadValidatorIntegrationTest.java
# ni agregarles @ActiveProfiles a mano.
#
# Motivo por el que hacía falta esto: application.properties tiene
# spring.datasource.url=${DB_URL} (y app.clave-acceso, supabase.url,
# supabase.service-role-key) SIN valor por defecto -- a propósito, para forzar
# a definirlos en cada entorno real. Eso está perfecto para levantar el backend
# de verdad, pero rompe los tests que arrancan el contexto completo de Spring
# (@SpringBootTest) cuando corren por ".\mvnw.cmd test" desde una terminal que
# no tiene las variables de entorno del launch.json del IDE: Spring no puede
# resolver el placeholder y tira BeanCreationException antes de poder levantar
# nada. Con esto, esos 7 tests corren solos, sin Postgres/Supabase real y sin
# depender de ninguna variable de entorno.
# ============================================================================

spring.profiles.active=test

# ---------------------------------------------------------------------------
# Base H2 en memoria: se crea vacía al arrancar el contexto y se destruye al
# cerrarlo (DB_CLOSE_DELAY=-1 la mantiene viva mientras el contexto siga
# abierto). MODE=PostgreSQL activa el modo de compatibilidad de H2 con
# Postgres, para acercarse lo más posible al comportamiento real.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# create-drop (no "update" como en producción): en un test no hay nada que
# preservar entre corridas, y así cada contexto arranca con el esquema limpio
# generado desde las entidades JPA.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
logging.level.org.springframework.security=INFO

# ---------------------------------------------------------------------------
# Placeholders sin default en application.properties que también hacen falta
# para que el contexto levante (Spring resuelve los de producción por
# variable de entorno con "relaxed binding": CLAVE_ACCESO, SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY). Ninguno de los 43 tests actuales pega contra
# el "portón" real ni sube archivos a Supabase de verdad, así que un valor
# dummy alcanza.
# ---------------------------------------------------------------------------
app.clave-acceso=clave-de-test
supabase.url=http://localhost:54321
supabase.service-role-key=clave-de-test

# ---------------------------------------------------------------------------
# OJO: este archivo no se FUSIONA con src/main/resources/application.properties
# durante los tests -- lo REEMPLAZA por completo (Spring Boot busca un único
# recurso "classpath:/application.properties" y el classloader devuelve el
# primero que encuentra, que en un test run es el de target/test-classes).
# Por eso da igual que app.jwt.secret, app.jwt.expiration-ms, etc. tengan un
# default con la sintaxis ${VAR:default} en el application.properties de
# producción: ese archivo ni se lee durante los tests, así que ese default
# nunca se aplica. Hay que repetir acá, como valor de test, TODO @Value que
# use algún @Component/@Service que Spring instancie al levantar el contexto
# -- si no, la próxima placeholder sin resolver (después de esta tanda) va a
# tirar el mismo PlaceholderResolutionException, solo que con otro nombre.
# ---------------------------------------------------------------------------
app.jwt.secret=test-jwt-secret-no-usar-en-produccion
app.jwt.expiration-ms=36000000
app.jwt.porton-expiration-ms=1800000
app.crypto.secret=test-crypto-secret-no-usar-en-produccion
app.cors.allowed-origins=http://localhost:5173
app.cors.allowed-origin-patterns=http://localhost:*
google.gemini.api.key=
google.gemini.api.url=http://localhost/gemini-test-no-usado
