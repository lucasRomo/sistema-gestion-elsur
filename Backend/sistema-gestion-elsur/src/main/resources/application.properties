spring.application.name=sistema-gestion

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.clave-acceso=${CLAVE_ACCESO}

# Antes tenían un valor por defecto hardcodeado acá (ElSur_CentroDeCopiado_SecretKey_2026 /
# ElSur_CentroDeCopiado_CryptoKey_2026) que se usaba en silencio si no se definía la variable de
# entorno -- eso significaba que si en el deploy te olvidabas de cargar JWT_SECRET/CRYPTO_SECRET,
# el sistema arrancaba igual pero firmando sesiones (y cifrando la copia "para ver" de la
# contraseña) con una clave que queda escrita en el código fuente. Ahora, si falta la variable de
# entorno, el backend directamente no arranca -- mejor eso que arrancar inseguro sin que nadie lo
# note. En tu máquina para desarrollo local: cargalas junto con DB_URL/DB_USERNAME/DB_PASSWORD
# (launch.json, o exportalas en la terminal). En Render: variables de entorno del servicio.
app.jwt.secret=${JWT_SECRET}

app.jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}

app.jwt.porton-expiration-ms=${JWT_PORTON_EXPIRATION_MS:1800000}

app.crypto.secret=${CRYPTO_SECRET}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://192.168.*:*,http://10.*:*,http://172.*:*}

spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=15MB

spring.servlet.multipart.max-request-size=15MB

server.tomcat.max-swallow-size=20MB

# DEBUG de seguridad loguea cada request (y headers) -- muy lento y expone datos en los logs.
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# Imprimir cada SQL en consola frena mucho el backend (cada pedido dispara varias consultas).
# Para depurar localmente: SHOW_SQL=true
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

# Optimización para Supabase: en vez de una consulta por cada colección/relación de cada
# registro (problema N+1 -- con 200 pedidos eran más de 1000 viajes a la base), Hibernate
# las carga en lotes de hasta 100 con un "WHERE id IN (...)".
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Pool de conexiones: Supabase limita las conexiones simultáneas; un pool chico y con
# conexiones que se renuevan antes de que el pooler las corte evita errores y esperas.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1500000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.address=0.0.0.0
# Render asigna el puerto por la variable PORT; en local sigue siendo 8080.
server.port=${PORT:8080}

# Comprimir las respuestas JSON: la lista de pedidos con sus relaciones pesa bastante y
# viaja de Render al navegador en cada pantalla (suele bajar a ~1/5 del tamaño).
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/html,application/javascript,text/css
server.compression.min-response-size=2048

# Necesario: los controladores devuelven entidades con relaciones LAZY que se serializan al
# armar la respuesta. Se declara explícito para que no aparezca el warning al iniciar.
spring.jpa.open-in-view=true

# Solo /actuator/health, para el health check de Render (sin detalles internos).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

google.gemini.api.key=${GEMINI_API_KEY:}
google.gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent

# Usadas por SupabaseStorageService (subida de comprobantes, documentos del repositorio y
# respaldos). No estaban listadas acá antes -- funcionaban igual porque Spring Boot las toma
# directo de la variable de entorno (SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY), pero quedaban
# invisibles a simple vista. Las dejo documentadas para que no se te pasen al cargar las
# variables de entorno en Render.
supabase.url=${SUPABASE_URL}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
