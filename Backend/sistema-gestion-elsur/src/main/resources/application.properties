# Nombre de tu aplicación
spring.application.name=sistema-gestion

# Configuración de la conexión a PostgreSQL
# Si al instalar Postgres no cambiaste el puerto, es el 5432
spring.datasource.url=jdbc:postgresql://localhost:5432/elsur_imprenta
spring.datasource.username=postgres
spring.datasource.password=root

# Estrategia de actualización de la base de datos
# 'update' hace que Hibernate cree las tablas automáticamente según tus clases Java
spring.jpa.hibernate.ddl-auto=update

# Definir el tamaño máximo permitido para un solo archivo
spring.servlet.multipart.max-file-size=15MB

# Definir el tamaño máximo para la solicitud completa (por si se mandan varios campos)
spring.servlet.multipart.max-request-size=15MB

logging.level.org.springframework.security=DEBUG

# Mostrar las consultas SQL en la consola (muy útil para aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Para Conexion IP para Celular
server.address=0.0.0.0

# Para Implementación de IA Producto
google.gemini.api.key=
google.gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent