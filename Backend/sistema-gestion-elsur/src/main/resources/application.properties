
spring.application.name=sistema-gestion

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.clave-acceso=${CLAVE_ACCESO}


app.jwt.secret=${JWT_SECRET:'ElSur_CentroDeCopiado_SecretKey_2026'}


app.jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}


app.jwt.porton-expiration-ms=${JWT_PORTON_EXPIRATION_MS:1800000}


app.crypto.secret=${CRYPTO_SECRET:ElSur_CentroDeCopiado_CryptoKey_2026}


app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}


app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://192.168.*:*,http://10.*:*,http://172.*:*}


spring.jpa.hibernate.ddl-auto=update


spring.servlet.multipart.max-file-size=15MB


spring.servlet.multipart.max-request-size=15MB


server.tomcat.max-swallow-size=20MB

logging.level.org.springframework.security=DEBUG


spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


server.address=0.0.0.0


google.gemini.api.key=
google.gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent
