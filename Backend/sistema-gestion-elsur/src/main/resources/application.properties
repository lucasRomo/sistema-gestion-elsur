# Nombre de tu aplicación
spring.application.name=sistema-gestion

# Configuración de la conexión a PostgreSQL
# URL, usuario y password vienen de variables de entorno (ver launch.json para debug local,
# o exportalas en el entorno donde despliegues la app: terminal, Docker, servidor, etc.)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.clave-acceso=${CLAVE_ACCESO}

# Secreto para firmar los JWT. Se toma de la variable de entorno JWT_SECRET; si no está
# definida, se usa el valor de acá como default SOLO para desarrollo. En producción definí
# JWT_SECRET en el entorno (nunca lo subas hardcodeado al repositorio).
app.jwt.secret=${JWT_SECRET:ElSur_CentroDeCopiado_SecretKey_2026}

# Duración del token de sesión normal, en milisegundos (antes estaba hardcodeado como
# EXPIRATION_TIME dentro de JwtService.java). 36000000 ms = 10 horas.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}

# Duración del token del "portón" (acceso físico / bootstrap de alta), en milisegundos
# (antes PORTON_EXPIRATION_TIME hardcodeado en JwtService.java). 1800000 ms = 30 minutos.
app.jwt.porton-expiration-ms=${JWT_PORTON_EXPIRATION_MS:1800000}

# Clave para el cifrado reversible (AES) de la copia "para ver" de la contraseña
# (CifradoService) -- NO es lo mismo que el hash BCrypt de login, que sigue siendo
# el único que se usa para autenticar. Igual que el secreto del JWT: definí
# CRYPTO_SECRET en el entorno antes de desplegar y no la subas hardcodeada al repo.
app.crypto.secret=${CRYPTO_SECRET:ElSur_CentroDeCopiado_CryptoKey_2026}

# Orígenes permitidos para CORS (separados por coma si hay más de uno). Antes se
# aceptaba cualquier origen ("*"); ahora hay que listar acá la URL real del front,
# tanto en desarrollo como en producción. AJUSTAR antes de desplegar.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Patrones de origen adicionales para poder abrir el front desde la IP de la red local
# (ej: http://192.168.1.15:5173 desde el celular o la notebook de un compañero en el
# mismo WiFi que la compu que corre el backend), sin tener que hardcodear cada IP acá
# arriba. El '*' matchea cualquier cosa en ese lugar (puerto incluido con ':*').
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://192.168.*:*,http://10.*:*,http://172.*:*}

# Estrategia de actualización de la base de datos
# 'update' hace que Hibernate cree las tablas automáticamente según tus clases Java
spring.jpa.hibernate.ddl-auto=update

# Definir el tamaño máximo permitido para un solo archivo
spring.servlet.multipart.max-file-size=15MB

# Definir el tamaño máximo para la solicitud completa (por si se mandan varios campos)
spring.servlet.multipart.max-request-size=15MB

# CORREGIDO (bug reportado: "no me deja subir archivos al repositorio" -- el navegador
# mostraba un error de conexión nativo, no uno de nuestros modales): Tomcat tiene su
# PROPIO límite, independiente de los de arriba, para cuánto del cuerpo de una petición
# está dispuesto a "tragarse" (leer y descartar) antes de poder cerrar la conexión de
# forma prolija y devolver una respuesta de error. Por defecto es apenas 2MB. Cuando se
# sube un archivo que supera max-file-size, Spring corta la lectura en el momento en que
# detecta el exceso -- pero si el archivo es grande (típico en un escaneo de varias
# páginas antes de que nuestra propia compresión de PDF llegue a correr, ya que eso pasa
# DESPUÉS de recibir el archivo completo), quedan de sobra más de 2MB sin leer. Tomcat,
# al no poder tragarse el resto, corta la conexión en seco en vez de responder con un
# error legible -- eso es lo que el navegador mostraba como un error de conexión nativo
# en vez de nuestro modal de error de siempre. Se sube este límite para que coincida con
# el de arriba y la conexión pueda cerrarse siempre de forma prolija.
server.tomcat.max-swallow-size=20MB

logging.level.org.springframework.security=DEBUG

# Mostrar las consultas SQL en la consola (muy útil para aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Para Conexion IP para Celular
server.address=0.0.0.0

# Para Implementación de IA Producto
google.gemini.api.key=
google.gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent
