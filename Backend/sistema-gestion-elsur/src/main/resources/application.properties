spring.application.name=sistema-gestion

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.clave-acceso=${CLAVE_ACCESO}

# Antes tenían un valor por defecto hardcodeado acá (ElSur_CentroDeCopiado_SecretKey_2026 /
# ElSur_CentroDeCopiado_CryptoKey_2026) que se usaba en silencio si no se definía la variable de
# entorno -- eso significaba que si en el deploy te olvidabas de cargar JWT_SECRET/CRYPTO_SECRET,
# el sistema arrancaba igual pero firmando sesiones (y cifrando la copia "para ver" de la
# contraseña) con una clave que queda escrita en el código fuente. Ahora, si falta la variable de
# entorno, el backend directamente no arranca -- mejor eso que arrancar inseguro sin que nadie lo
# note. En tu máquina para desarrollo local: cargalas junto con DB_URL/DB_USERNAME/DB_PASSWORD
# (launch.json, o exportalas en la terminal). En Render: variables de entorno del servicio.
app.jwt.secret=${JWT_SECRET}

app.jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}

app.jwt.porton-expiration-ms=${JWT_PORTON_EXPIRATION_MS:1800000}

app.crypto.secret=${CRYPTO_SECRET}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://192.168.*:*,http://10.*:*,http://172.*:*}

spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=15MB

spring.servlet.multipart.max-request-size=15MB

server.tomcat.max-swallow-size=20MB

logging.level.org.springframework.security=DEBUG

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.address=0.0.0.0

google.gemini.api.key=${GEMINI_API_KEY:}
google.gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent

# Usadas por SupabaseStorageService (subida de comprobantes, documentos del repositorio y
# respaldos). No estaban listadas acá antes -- funcionaban igual porque Spring Boot las toma
# directo de la variable de entorno (SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY), pero quedaban
# invisibles a simple vista. Las dejo documentadas para que no se te pasen al cargar las
# variables de entorno en Render.
supabase.url=${SUPABASE_URL}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
